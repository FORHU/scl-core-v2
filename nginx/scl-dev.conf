# HTTP: redirect all traffic to HTTPS non-www
server {
    listen 80;
    server_name scl-dev.forhu.ai www.scl-dev.forhu.ai;
    return 301 https://scl-dev.forhu.ai$request_uri;
}

# HTTPS www: redirect to non-www
server {
    listen 443 ssl;
    server_name www.scl-dev.forhu.ai;

    ssl_certificate     /etc/letsencrypt/live/scl-dev.forhu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scl-dev.forhu.ai/privkey.pem;

    return 301 https://scl-dev.forhu.ai$request_uri;
}

# HTTPS non-www: primary — proxies to scl-core-v2
server {
    listen 443 ssl;
    server_name scl-dev.forhu.ai;

    ssl_certificate     /etc/letsencrypt/live/scl-dev.forhu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scl-dev.forhu.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
