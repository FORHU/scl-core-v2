<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCL Chat Console</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 16px; background: #f0f2f5; }

        h2 { margin: 0 0 12px; font-size: 1.1rem; color: #2c3e50; }

        /* ── Two-panel layout ── */
        .panels { display: flex; gap: 14px; align-items: stretch; }
        .panel  { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        .panel-head { padding: 8px 14px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em; flex-shrink: 0; }
        .panel-head.response { background: #2980b9; color: #fff; }
        .panel-head.trace    { background: #2c3e50; color: #ecf0f1; }

        /* ── Chat history ── */
        #chat-panel {
            padding: 14px; height: 360px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { max-width: 88%; padding: 9px 13px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
        .msg.user      { align-self: flex-end; background: #2980b9; color: #fff; border-bottom-right-radius: 3px; }
        .msg.assistant { align-self: flex-start; background: #f1f3f5; color: #2c3e50; border-bottom-left-radius: 3px; }
        .msg.assistant.streaming { border-left: 3px solid #2980b9; }

        /* ── Trace panel ── */
        #trace-panel {
            padding: 12px; height: 360px; overflow-y: auto;
            font-family: monospace; font-size: 0.77rem;
            color: #d4d4d4; background: #1e1e1e; white-space: pre-wrap; line-height: 1.55;
        }

        /* ── Input area ── */
        .input-area {
            display: flex; gap: 8px; align-items: flex-end;
            margin-top: 10px; padding: 10px 12px;
            background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #user-input {
            flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 0.88rem; font-family: inherit; resize: none;
            min-height: 42px; max-height: 120px; overflow-y: auto;
            line-height: 1.5;
        }
        #user-input:focus { outline: none; border-color: #2980b9; }
        .btn { padding: 9px 18px; cursor: pointer; border: none; border-radius: 6px; color: #fff; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
        .btn-send  { background: #2980b9; }
        .btn-send:hover  { background: #1f6691; }
        .btn-send:disabled { background: #aaa; cursor: default; }
        .btn-clear { background: #7f8c8d; }
        .btn-clear:hover { background: #636e72; }

        /* ── Options row ── */
        .opts-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
        .opts-row label { font-size: 0.8rem; color: #555; display: flex; align-items: center; gap: 4px; }
        select { font-size: 0.8rem; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; }

        /* ── Status bar ── */
        #status-bar { display: none; margin: 6px 0; padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
        .s-running { background: #eaf4fb; color: #2980b9; display: block !important; }
        .s-hitl    { background: #fef9e7; color: #d35400; display: block !important; }
        .s-done    { background: #eafaf1; color: #27ae60; display: block !important; }

        /* ── HITL box ── */
        .hitl-box { display: none; margin-top: 8px; padding: 11px 14px; background: #fff8e1; border: 1px solid #f0a500; border-radius: 8px; }
        .hitl-box.visible { display: block; }
        .hitl-box h4 { margin: 0 0 6px; font-size: 0.85rem; color: #d35400; }
        .hitl-box pre { font-size: 0.73rem; background: #f5f5f5; padding: 7px; border-radius: 4px; overflow-x: auto; margin: 0 0 8px; }
        .hitl-btns { display: flex; gap: 8px; }
        .btn-approve { background: #27ae60; }
        .btn-approve:hover { background: #1e8449; }
        .btn-reject  { background: #e74c3c; }
        .btn-reject:hover { background: #b03a2e; }
        .btn-skip    { background: #95a5a6; }

        /* ── Trace colors ── */
        .t-cycle     { color: #7ec8e3; font-weight: 700; }
        .t-cognition { color: #a8d8a8; }
        .t-control   { color: #f9ca24; }
        .t-action    { color: #f0932b; }
        .t-memory    { color: #c39bd3; }
        .t-retrieval { color: #74b9ff; }
        .t-hitl      { color: #fd79a8; font-weight: 700; }
        .t-summary   { color: #b2bec3; }
        .t-tool      { color: #f0932b; }

        @media (max-width: 760px) { .panels { flex-direction: column; } }
    </style>
</head>
<body>

<h2>🤖 SCL Chat Console</h2>

<div class="panels">
    <!-- Left: Chat -->
    <div class="panel">
        <div class="panel-head response">💬 Assistant Response</div>
        <div id="chat-panel">
            <div class="msg assistant">Hello! Please give me any instruction.</div>
        </div>
        <div class="hitl-box" id="hitl-box">
            <h4 id="hitl-title">⚠️ Pending Approval</h4>
            <pre id="hitl-args"></pre>
            <div class="hitl-btns">
                <button class="btn btn-approve" onclick="resolveHITL('approved')">✔ Approve</button>
                <button class="btn btn-reject"  onclick="resolveHITL('rejected')">✘ Reject</button>
                <button class="btn btn-skip"    onclick="resolveHITL('skipped_continue')">⇒ Skip</button>
            </div>
        </div>
    </div>

    <!-- Right: SCL Monitor -->
    <div class="panel">
        <div class="panel-head trace">📊 SCL Monitor</div>
        <div id="trace-panel">Waiting for execution...</div>
    </div>
</div>

<!-- Input area -->
<div class="input-area">
    <textarea id="user-input" placeholder="Enter your instruction (Shift+Enter for newline, Enter to send)..." rows="1"></textarea>
    <button class="btn btn-send" id="send-btn" onclick="sendMessage()">Send</button>
    <button class="btn btn-clear" onclick="clearAll()">Reset</button>
</div>
<div class="opts-row">
    <label><input type="checkbox" id="rag-toggle" checked> Use RAG</label>
    <label>Language:
        <select id="lang-select">
            <option value="Korean">Korean</option>
            <option value="English" selected>English</option>
        </select>
    </label>
    <label title="Additional regulation text to add to the server">Additional Regulation:
        <input type="text" id="custom-reg" placeholder="(optional)" style="width:200px; padding:3px 7px; border:1px solid #ccc; border-radius:4px; font-size:0.8rem;">
    </label>
</div>
<div id="status-bar"></div>

<script src="scl_browser_connector.js"></script>
<script>
    // ── DOM refs ──
    const chatPanel   = document.getElementById('chat-panel');
    const tracePanel  = document.getElementById('trace-panel');
    const statusBar   = document.getElementById('status-bar');
    const hitlBox     = document.getElementById('hitl-box');
    const hitlTitle   = document.getElementById('hitl-title');
    const hitlArgsEl  = document.getElementById('hitl-args');
    const userInput   = document.getElementById('user-input');
    const sendBtn     = document.getElementById('send-btn');

    // ── State ──
    let connector    = null;
    let hitlResolve  = null;
    let memCount     = 0;
    let streamingDiv = null;   // currently streaming assistant bubble
    let streamBuf    = '';     // accumulated text for current streaming bubble

    // ── Init ──
    window.onload = () => {
        try {
            if (typeof SCLBrowserConnector === 'undefined') throw new Error();
            connector = new SCLBrowserConnector("http://127.0.0.1:8000");
        } catch {
            addBubble('assistant', '⚠ scl_browser_connector.js not found.');
        }
    };

    // ── Keyboard: Enter sends, Shift+Enter newline ──
    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    // Auto-resize textarea
    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    // ── Routing: technical vs response ──
    const TECH_RE = /^(Cycle\s+\d+|>\s*(Cognition|Control|Action|Memory|HITL|Retrieval):)/;
    const TECH_KW = ["retrieval","memory","cycle","cognition","control","action","clues","relevance"];
    function isTechnical(d) {
        if (TECH_RE.test(d.trim())) return true;
        const low = d.toLowerCase();
        return TECH_KW.some(k => low.includes(k));
    }

    // ── Chat bubbles ──
    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        chatPanel.appendChild(div);
        chatPanel.scrollTop = chatPanel.scrollHeight;
        return div;
    }

    function startStreamingBubble() {
        streamBuf = '';
        streamingDiv = document.createElement('div');
        streamingDiv.className = 'msg assistant streaming';
        chatPanel.appendChild(streamingDiv);
        chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    function appendToStream(text) {
        streamBuf += text;
        // \n → visible line break; sentence-boundary fallback
        const formatted = streamBuf.replace(/([.!?])(?=[A-Z▶►])/g, '$1\n');
        streamingDiv.innerHTML = formatted
            .split('\n')
            .map(l => l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))
            .join('<br>');
        chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    function finalizeStream() {
        if (streamingDiv) {
            streamingDiv.classList.remove('streaming');
            streamingDiv = null;
            streamBuf = '';
        }
    }

    // ── Trace helpers ──
    function traceSpan(text) {
        const t = text.trim();
        let cls = 't-summary';
        if (/^Cycle\s+\d+/.test(t))        cls = 't-cycle';
        else if (/^>\s*Cognition:/.test(t)) cls = 't-cognition';
        else if (/^>\s*Control:/.test(t))   cls = 't-control';
        else if (/^>\s*Action:/.test(t))    cls = 't-action';
        else if (/^>\s*Memory:/.test(t))    cls = 't-memory';
        else if (/^>\s*Retrieval:/.test(t)) cls = 't-retrieval';
        else if (/^>\s*HITL:/.test(t))      cls = 't-hitl';
        else if (/^[▶►]/.test(t))          cls = 't-tool';
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = text + '\n';
        return span;
    }
    function appendTrace(text) {
        if (!text.trim()) return;
        tracePanel.appendChild(traceSpan(text));
        tracePanel.scrollTop = tracePanel.scrollHeight;
    }
    function appendTraceRaw(text) {
        text.split('\n').forEach(line => {
            if (line.trim()) tracePanel.appendChild(traceSpan(line));
            else tracePanel.appendChild(document.createTextNode('\n'));
        });
        tracePanel.scrollTop = tracePanel.scrollHeight;
    }

    // ── Status ──
    function setStatus(msg, cls) {
        statusBar.textContent = msg;
        statusBar.className = cls || '';
    }

    // ── HITL ──
    function resolveHITL(decision) {
        hitlBox.classList.remove('visible');
        setStatus('⏳ Resuming after HITL decision...', 's-running');
        if (hitlResolve) { hitlResolve(decision); hitlResolve = null; }
    }

    // ── Clear ──
    function clearAll() {
        chatPanel.innerHTML = '<div class="msg assistant">Hello! Please give me any instruction.</div>';
        tracePanel.textContent = 'Waiting for execution...';
        hitlBox.classList.remove('visible');
        setStatus('');
        memCount = 0;
        streamingDiv = null;
        streamBuf = '';
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.value = '';
        userInput.style.height = 'auto';
    }

    // ── Send ──
    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query || !connector) return;

        const isRag    = document.getElementById('rag-toggle').checked;
        const lang     = document.getElementById('lang-select').value;
        const customReg = document.getElementById('custom-reg').value.trim();

        addBubble('user', query);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;
        userInput.disabled = true;
        memCount = 0;

        tracePanel.textContent = '';
        startStreamingBubble();
        setStatus('⏳ Agent is thinking...', 's-running');

        try {
            await connector.runCase('chat', query, {

                onChunk: (delta) => {
                    if (/^\n+$/.test(delta)) { appendToStream(delta); return; }
                    const cleaned = delta.replace(/^\n(>)/, '$1');

                    if (/^>\s*Memory:/.test(cleaned)) {
                        memCount++;
                        const m = cleaned.match(/fact:\s*([\s\S]{1,80})/);
                        let fact = m ? m[1].trim().replace(/\n/g, ' ') : '';
                        if (fact.length > 40) fact = fact.substring(0, 40) + '…';
                        appendTrace(fact
                            ? `> Memory: stored → ${fact} (${memCount} entries)`
                            : `> Memory: fact stored (${memCount} entries)`);
                        return;
                    }

                    if (isTechnical(cleaned)) {
                        appendTrace(cleaned.trim());
                    } else {
                        appendToStream(cleaned);
                    }
                },

                onPendingApproval: async (payload) => {
                    const tool = payload.tool_name || '(unknown)';
                    hitlTitle.textContent  = `⚠️ Pending Approval: ${tool}`;
                    hitlArgsEl.textContent = JSON.stringify(payload.arguments || {}, null, 2);
                    hitlBox.classList.add('visible');
                    setStatus(`⚠️ Pending Approval: ${tool}`, 's-hitl');
                    appendTrace(`> HITL: approval required — ${tool}`);
                    const decision = await new Promise(r => { hitlResolve = r; });
                    appendTrace(`> HITL: decision = ${decision}`);
                    return decision;
                },

                onComplete: (payload) => {
                    if (payload.trace_summary) {
                        tracePanel.appendChild(document.createTextNode('\n'));
                        appendTrace('── Glassbox Trace Summary ──');
                        appendTraceRaw(payload.trace_summary);
                    }
                    finalizeStream();
                    setStatus('✅ Done', 's-done');
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                }

            }, { language: lang, rag_enabled: isRag, custom_regulation: customReg || undefined });

        } catch (err) {
            finalizeStream();
            addBubble('assistant', `⚠ Error: ${err}`);
            setStatus('⚠ Error occurred', 's-hitl');
            sendBtn.disabled = false;
            userInput.disabled = false;
        }
    }
</script>
</body>
</html>
